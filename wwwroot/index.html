<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b57d0"><link rel="manifest" href="/manifest.webmanifest"><title>SJPCORE Remote</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font:16px system-ui,sans-serif}.shell{max-width:720px;margin:auto;padding:20px}.card{background:#fff;border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 8px 30px #20305012}h1{font-size:26px}label{display:block;margin:13px 0 6px;font-weight:650}input,select,button{width:100%;min-height:48px;border-radius:12px;border:1px solid #cfd6e4;padding:10px;font:inherit}button{margin-top:14px;border:0;background:#0b57d0;color:#fff;font-weight:700}button.secondary{background:#e8eef9;color:#163765}.hidden{display:none}.status{padding:12px;border-radius:12px;background:#eef4ff;margin:12px 0}.error{background:#ffeaed;color:#8d1726}audio{width:100%;margin-top:10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:520px){.row{grid-template-columns:1fr}}
</style></head><body><main class="shell"><h1>SJPCORE Remote</h1><div id="status" class="status">พร้อมเชื่อมต่อ</div>
<section id="pair" class="card"><h2>จับคู่กับ Site</h2><label>Site ID</label><input id="site" autocomplete="off"><label>รหัส 6 หลัก</label><input id="code" inputmode="numeric" maxlength="6" pattern="[0-9]{6}"><label>ชื่ออุปกรณ์</label><input id="device" maxlength="100"><button id="pairBtn">จับคู่</button></section>
<section id="app" class="hidden"><div class="card"><h2>ไฟล์ประกาศ</h2><input id="audioFile" type="file" accept="audio/mpeg,audio/wav,audio/ogg,audio/webm"><audio id="preview" controls></audio><button id="uploadBtn">อัปโหลดไฟล์</button></div>
<div class="card"><h2>กำหนดเวลา</h2><label>ไฟล์ที่อัปโหลด</label><input id="audioKey" readonly><label>สถานีหรือกลุ่ม</label><select id="target"></select><div class="row"><div><label>วันและเวลา</label><input id="time" type="datetime-local"></div><div><label>ระยะเวลา (นาที)</label><input id="duration" type="number" min="1" value="1"></div></div><label>การเล่นซ้ำ</label><select id="repeat"><option value="once">ครั้งเดียว</option><option value="everyDay">ทุกวัน</option><option value="everyWeekday">จันทร์–ศุกร์</option><option value="everyWeek">ทุกสัปดาห์</option><option value="everyWorkday">ทุกวันราชการ</option></select><button id="scheduleBtn">สร้างกำหนดการ</button></div>
<div class="card"><h2>กำหนดการ</h2><div id="schedules">กำลังโหลด…</div><button class="secondary" id="refreshBtn">รีเฟรชสถานะ</button></div></section></main><script src="/app.js"></script></body></html>
